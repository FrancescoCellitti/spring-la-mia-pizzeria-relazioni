<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingredienti</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div th:replace="fragments/Navbar :: navbar"></div>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h4 mb-0">Ingredienti</h1>
      <a th:href="@{/ingridients/create}" class="btn btn-primary">Nuovo ingrediente</a>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Descrizione</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="ing : ${ingridients}">
            <td th:text="${ing.id}"></td>
            <td th:text="${ing.description}"></td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="text-muted" th:if="${ingridients == null or #lists.isEmpty(ingridients)}">Nessun ingrediente presente.</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
