<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Nuovo ingrediente</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

	<style>
		.form-control.is-invalid~.invalid-feedback {
			display: block;
		}
	</style>
</head>

<body>
	<div th:replace="fragments/Navbar :: navbar"></div>

	<div class="container py-4">
		<h1 class="h4 mb-3">Nuovo ingrediente</h1>

			<form th:action="@{/ingridients/create}" th:object="${ingridient}" method="post" novalidate>
				<div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
					<strong>Correggi gli errori:</strong>
					<ul class="mb-0">
						<li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
					</ul>
				</div>
			<div class="mb-3">
				<label for="description" class="form-label">Descrizione</label>
				<input id="description" type="text" th:field="*{description}" class="form-control"
					th:classappend="${#fields.hasErrors('description')} ? ' is-invalid'">
				<div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
				</div>
			</div>

			<div class="d-flex gap-2">
				<button class="btn btn-primary" type="submit">Salva</button>
				<a th:href="@{/ingridients}" class="btn btn-secondary">Annulla</a>
			</div>
		</form>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
